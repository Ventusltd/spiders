name: Maya hunt (explain dead ends)
on:
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC
  workflow_dispatch:
jobs:
  hunt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Hunt dead ends and assign Maya cards
        run: node tools/maya-hunt/maya-hunter.mjs tools/maya-hunt/data
      - name: Commit the cards if they changed
        run: |
          git config user.name "maya-hunt"
          git config user.email "noreply@ventusltd.com"
          git add tools/maya-hunt/data
          git diff --cached --quiet || git commit -m "maya-hunt: reassign dead-end cards ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push

rgba(0,229,255,.55)}.focus{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(0,229,255,.22),0 0 26px rgba(0,229,255,.12);margin-bottom:16px}.row{display:flex;align-items:center;gap:7px}.badge{font-size:.55rem;letter-spacing:.07em;border:1px solid var(--line);border-radius:6px;padding:2px 5px;color:var(--muted);flex:none}.name{font-size:.9rem;font-weight:650;line-height:1.15;overflow-wrap:anywhere}.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-left:auto;box-shadow:0 0 8px currentColor}.reason{font-size:.7rem;color:var(--muted);line-height:1.3}.go{font-size:.62rem;color:var(--cyan);margin-left:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.sect{font-family:ui-monospace,monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}.spider{position:relative;min-height:720px;overflow:auto;border:1px solid var(--line);border-radius:18px;background:radial-gradient(circle at center,rgba(255,213,74,.06),transparent 36%),radial-gradient(circle at center,rgba(0,229,255,.045),transparent 45%)}.node{position:absolute;width:230px;transform:translate(-50%,-50%)}.node.center{width:270px}.wire{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.src{margin-left:auto;border:1px solid rgba(0,229,255,.35);border-radius:999px;padding:2px 8px;color:var(--cyan);font-size:.56rem;letter-spacing:.1em;text-transform:uppercase}.inert{opacity:.34}@media(max-width:680px){.node{position:static;transform:none;width:auto;margin:10px}.spider{min-height:0;padding:10px}.wire{display:none}.node.center{width:auto}}

<div class="top"><div class="bar"><div class="brand"><span class="ey">Ventus · Global Grid 2050</span><h1>spider_maya v1</h1></div><span class="src">declared cartridge</span></div><div class="controls"><span class="seg"><button data-action="explore" aria-pressed="true">Explore</button><button data-action="github" aria-pressed="false">GitHub</button><button data-action="external" aria-pressed="false">External</button></span><span class="seg"><button class="gold" data-view="column" aria-pressed="true">Column</button><button class="gold" data-view="spider" aria-pressed="false">🕷 Spider</button></span></div><div class="crumbs" id="crumbs">globalgrid2050 › spider_maya v1 declared live apps</div></div>

].map(n=>({...n,provenance:"declared",methodState:"human-insertion",schemaVersion:"spider_maya.declared_cartridge.v1"})),edges:[]};
CART.edges=CART.nodes.slice(1).map(n=>({from:"catalogue",to:n.id,type:"contains",provenance:"declared",methodState:"human-insertion",schemaVersion:CART.schemaVersion}));
const colour={green:"#00ff88",amber:"#ffcc00",red:"#ff5555",blue:"#3aa0ff",grey:"#9298a6"}, badge={data:"DB",eye_app:"EYE",sense_app:"SENSE",served_surface:"PAGE"};let action="explore",view="column";
function target(n){return action==="github"?(n.gh||n.ext):action==="external"?(n.ext||n.gh):null}function card(n,cls=""){const go=target(n)?'<span class="go">open ↗</span>':'';return `<div class="card ${cls}" data-id="${n.id}"><div class="row"><span class="badge">${badge[n.type]||"NODE"}</span><span class="name">${n.label}</span><span class="dot" style="color:${colour[n.rag]||colour.grey}"></span></div><div class="reason">${n.reason}</div><div class="row"><span class="badge">${n.provenance}</span><span class="badge">${n.methodState}</span>${go}</div></div>`}
function openNode(id){const n=CART.nodes.find(x=>x.id===id);const t=target(n);if(t) window.open(t,"_blank","noopener")}function draw(){const stage=document.getElementById("stage"), root=CART.nodes[0], apps=CART.nodes.slice(1);if(view==="column"){stage.innerHTML=card(root,"focus")+`<div class="sect">Contains → ${apps.length} declared live doors</div><div class="grid">${apps.map(n=>card(n)).join("")}</div>`}else{const w=1100,h=760,cx=w/2,cy=h/2,r=300;let wires=`<svg class="wire" viewBox="0 0 ${w} ${h}">${apps.map((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/apps.length,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#7da0c8" stroke-width="1.8" opacity=".75"/>`}).join("")}</svg>`;stage.innerHTML=`<div class="spider" style="min-width:${w}px">${wires}<div class="node center" style="left:${cx}px;top:${cy}px">${card(root,"focus")}</div>${apps.map((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/apps.length,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;return `<div class="node" style="left:${x}px;top:${y}px">${card(n)}</div>`}).join("")}</div>`}document.querySelectorAll(".card").forEach(el=>el.addEventListener("click",()=>openNode(el.dataset.id)))}
